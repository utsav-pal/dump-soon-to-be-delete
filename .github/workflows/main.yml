name: Ping Render Services

on:
  schedule:
    # Runs every 10 minutes to stay within Render's 15-min window
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Teladoc Service
        run: curl -I https://teladoc.onrender.com/

      - name: Ping Mammogram Classification Service
        run: curl -I https://mamogram-classification-zgjz.onrender.com/
